<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名片自动化拼版系统</title>
    <link rel="stylesheet" href="/namecard(JS)/code/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-glow"></div>

    <main class="app-card">
        <header class="app-header">
            <div class="badge"><span class="dot"></span> PRINT STUDIO PRO</div>
            <h1>名片自动化拼版系统</h1>
            <p>上传名片正面与背面文件，秒级生成带角线出血的矢量 PDF</p>
        </header>

        <form action="/imposition" method="post" enctype="multipart/form-data" id="impositionForm">
            <!-- 纸张与出血配置 -->
            <div class="config-grid">
                <div class="form-group">
                    <label for="paper_choice">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        纸张规格
                    </label>
                    <div class="select-wrapper">
                        <select name="paper_choice" id="paper_choice">
                            <option value="1">A3 横向 (42.0×29.7cm | 20张/页)</option>
                            <option value="2">A4 竖向 (21.0×29.7cm | 10张/页)</option>
                        </select>
                        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.47" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
                        Bleed
                    </label>
                    <label class="toggle-switch" for="use_bleed">
                        <input type="checkbox" name="use_bleed" id="use_bleed" value="true" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">1.5mm / 0.15cm </span>
                    </label>
                </div>
            </div>

            <!-- 文件上传面板 -->
            <div class="upload-grid">
                <!-- 正面 -->
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        名片正面图
                    </label>
                    <div class="drop-zone" id="dropZoneFront">
                        <input type="file" name="front" id="front" accept="image/*" required class="file-input">
                        
                        <!-- 默认未上传状态 -->
                        <div class="drop-content" id="contentFront">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            </div>
                            <span class="drop-title">拖拽或点击上传正面</span>
                            <span class="file-status" id="frontFileInfo">支持 PNG / JPG</span>
                        </div>

                        <!-- 已上传实时预览图状态 -->
                        <div class="preview-container d-none" id="previewFront">
                            <img src="" alt="正面预览" class="img-preview" id="imgPreviewFront">
                            <span class="preview-filename" id="namePreviewFront"></span>
                            <button type="button" class="btn-change-img" id="changeBtnFront">更 换</button>
                        </div>
                    </div>
                </div>

                <!-- 背面 -->
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        名片背面图
                    </label>
                    <div class="drop-zone" id="dropZoneBack">
                        <input type="file" name="back" id="back" accept="image/*" required class="file-input">
                        
                        <!-- 默认未上传状态 -->
                        <div class="drop-content" id="contentBack">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            </div>
                            <span class="drop-title">拖拽或点击上传背面</span>
                            <span class="file-status" id="backFileInfo">支持 PNG / JPG</span>
                        </div>

                        <!-- 已上传实时预览图状态 -->
                        <div class="preview-container d-none" id="previewBack">
                            <img src="" alt="背面预览" class="img-preview" id="imgPreviewBack">
                            <span class="preview-filename" id="namePreviewBack"></span>
                            <button type="button" class="btn-change-img" id="changeBtnBack">更 换</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    立即拼版并生成 PDF
                </span>
                <span class="btn-loading d-none">
                    <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                    正在生成 PDF ...
                </span>
            </button>
        </form>
    </main>

    <script src="/namecard(JS)/code/static/app.js"></script>
</body>
</html>
